services:
  mcp-adeptos-crm:
    build: .
    container_name: mcp-adeptos-crm
    restart: always
    ports:
      - "3005:3005"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${PORT:-3005}
      # Taken from .env (do not hardcode production here — it overrides env_file)
      ADEPTOS_API_BASE_URL: ${ADEPTOS_API_BASE_URL:-http://adeptosApi:4000}
      ADEPTOS_JWT_TOKEN: ${ADEPTOS_JWT_TOKEN:-}
      ADEPTOS_BUSINESS_ID: ${ADEPTOS_BUSINESS_ID:-}
    env_file:
      - .env
    networks:
      - api_adeptos-network

networks:
  # Same network as local adeptosApi / adeptosDB / adeptosRedis
  api_adeptos-network:
    external: true
