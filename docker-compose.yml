services:
  mcp-adeptos-crm:
    build: .
    container_name: mcp-adeptos-crm
    restart: always
    ports:
      - "3005:3005"
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${PORT:-3005}
      ADEPTOS_API_BASE_URL: ${ADEPTOS_API_BASE_URL:-https://api.adeptos.ai}
      ADEPTOS_JWT_TOKEN: ${ADEPTOS_JWT_TOKEN:-}
      ADEPTOS_BUSINESS_ID: ${ADEPTOS_BUSINESS_ID:-}
    env_file:
      - .env
    networks:
      - mcp-net

networks:
  # VPS default: fr-hotel-network (agents / other MCPs)
  # Local Adeptos API: export MCP_DOCKER_NETWORK=api_adeptos-network
  mcp-net:
    name: ${MCP_DOCKER_NETWORK:-fr-hotel-network}
    external: true
